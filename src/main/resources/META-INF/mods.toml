modLoader="javafml"
loaderVersion="[40,)"
license="MIT"
issueTrackerURL="https://github.com/Vonix-Network/isleofberk-geckolib-fixes/issues"

[[mods]]
modId="isleofberkgeckolibfixes"
version="${version}"
displayName="Isle of Berk GeckoLib Fixes"
displayURL="https://github.com/Vonix-Network/isleofberk-geckolib-fixes"
# Client-render companion: a dedicated server may omit this mod. Neither side
# should reject a connection because the other side is missing it.
displayTest="IGNORE_ALL_VERSION"
authors="Vonix-Network"
description='''
Testable 0.1.0-beta.1 compatibility candidate. Guards GeckoLib 3.0.57
AnimationController.process when a boneSnapshot is missing by seeding it from
the matched bone's initial snapshot. This is not a GeckoLib fork and does not
replace GeckoLib or Isle of Berk.

Install on every client that renders Isle of Berk entities. A dedicated server
does not need this companion for the render crash; installing it there is
optional and does not substitute for client installation.
'''

[[dependencies.isleofberkgeckolibfixes]]
modId="forge"
mandatory=true
versionRange="[40,41)"
ordering="NONE"
side="BOTH"

[[dependencies.isleofberkgeckolibfixes]]
modId="minecraft"
mandatory=true
versionRange="[1.18.2,1.19)"
ordering="NONE"
side="BOTH"

[[dependencies.isleofberkgeckolibfixes]]
modId="geckolib3"
mandatory=true
versionRange="[3.0.57,3.0.58)"
ordering="AFTER"
side="BOTH"

[[dependencies.isleofberkgeckolibfixes]]
modId="isleofberk"
mandatory=true
versionRange="[1.2.0,1.3)"
ordering="AFTER"
side="BOTH"
